<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ — Wiki</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/home/index">
        <span class="logo-icon">💣</span>
        <span>EXPLODING KITTENS</span>
        <span class="wiki-label">WIKI</span>
    </a>
    <nav class="navigation">
        <a href="/home/index">Главная</a>
        <a href="/home/rules">Правила</a> 
        <a href="/home/index#cards">Карты</a>
        <a href="/home/expansions">Дополнения</a>
        <a href="/home/faq">FAQ</a>
    </nav>
    <a class="admin-link" href="/auth/login">Админ-панель</a>
</header>

<main class="section-panel" style="margin-top: 40px; margin-bottom: 40px;">
    <p class="eyebrow">ЕСТЬ ВОПРОС?</p>
    <h2>Часто задаваемые вопросы</h2>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
        $foreach(var item in Faq)
        <div style="background: #151618; padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
            <span style="color: var(--orange); font-size: 12px; font-weight: bold; text-transform: uppercase;">${item.Category}</span>
            <h3 style="margin-top: 10px; margin-bottom: 10px; font-size: 18px;">${item.Question}</h3>
            <p style="margin-bottom: 0; color: #d0d0d0; font-size: 14px;">${item.Answer}</p>
        </div>
        $endfor
    </div>
</main>

<footer class="footer">
    <div class="footer-bottom">Фанатский справочник. Все права на оригинальные изображения принадлежат их владельцам.</div>
</footer>
</body>
</html>
