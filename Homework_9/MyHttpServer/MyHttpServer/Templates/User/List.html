<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
</head>
<body>
<h1>Список пользователей из базы данных</h1>
<ul>
    $foreach(var user in Users)
    <li>
        <strong>${user.Name}</strong> — ${user.Email}, возраст: ${user.Age}
    </li>
    $endfor
</ul>
</body>
</html>
